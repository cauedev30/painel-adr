name: CI e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências Python
        run: python -m pip install -r requirements.txt

      - name: Testes do pipeline (pytest)
        run: python -m pytest

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dependências do painel
        working-directory: web
        run: npm ci

      - name: Testes do painel (Vitest)
        working-directory: web
        run: npm test

      - name: Build do painel
        working-directory: web
        run: npm run build
