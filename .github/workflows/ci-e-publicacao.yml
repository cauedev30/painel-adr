name: CI e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  testes:
    name: Testes e build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências Python
        run: python -m pip install -r requirements.txt

      # o pipeline monta o banco com o PGlite, que roda no Node
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dependências do painel
        working-directory: web
        run: npm ci

      # D2.12: a semente reproduz os mesmos brutos e o mesmo gabarito em outra máquina
      # (o .xlsx fica de fora: o openpyxl grava a hora dentro do arquivo)
      - name: Gerar dados
        run: python gerar_dados.py && git diff --exit-code -- dados/brutos/*.csv dados/gabarito.json

      # ler → tratar → validar → carregar; para o CI se a validação falhar
      - name: Pipeline
        run: python pipeline.py

      - name: Testes do pipeline (pytest)
        run: python -m pytest

      # D7.2: o notebook roda do zero e não pode quebrar quando o pipeline muda; a cópia executada vai
      # para uma pasta temporária, e a do repositório fica como está
      - name: Notebook
        run: jupyter nbconvert --to notebook --execute --output-dir /tmp notebooks/tour-do-pipeline.ipynb

      - name: Testes do painel (Vitest)
        working-directory: web
        run: npm test

      - name: Build do painel
        working-directory: web
        run: npm run build

      # só a main publica (D8.2); pull request roda os testes e para aqui
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: web/dist

  publicar:
    name: Publicação no GitHub Pages
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # D8.2: um deploy novo cancela o que ainda está em andamento (só a publicação; os testes de um
    # pull request não cancelam a da main)
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
